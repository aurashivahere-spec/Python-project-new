[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqtrust"
version = "0.1.0"
description = "A curated, post-quantum-ready registry of trusted signing keys."
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]

[project.scripts]
pqtrust = "pqtrust.__main__:main"

[tool.setuptools]
packages = ["pqtrust"]

[tool.setuptools.package-data]
pqtrust = ["anchors.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
